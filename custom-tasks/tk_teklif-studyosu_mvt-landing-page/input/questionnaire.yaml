schemaVersion: '1.0'
id: tk_teklif_studyosu_mvt_landing_page_v1
title: Teklif Studio Landing Page Multivariate Test
description: We are comparing landing-page variants for Teklif Stüdyosu. You will see four head-to-head comparisons.
