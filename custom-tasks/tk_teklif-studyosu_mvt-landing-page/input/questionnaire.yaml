  - id: set_2_a
    label: Option A
  - id: set_2_b
    label: Option B
  - id: set_2_neither
    label: Neither
  askRationale: true
- id: set_3
  prompt: 'Set 3: Which landing page would make you more likely to try the product?'
  type: single_choice
  construct: landing_choice_set_3
  required: true
  options:
  - id: set_3_a
    label: Option A
  - id: set_3_b
    label: Option B
  - id: set_3_neither
    label: Neither
